name: Publish Action Image

on:
  push:
    branches: [main]
    paths:
      - 'action/**'
      - 'server/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/publish-action-image.yml'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repository owner (GHCR requires lowercase image paths)
        id: repo
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: action/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner }}/flaky-test-detector-action:latest
            ghcr.io/${{ steps.repo.outputs.owner }}/flaky-test-detector-action:${{ github.sha }}
